name: Dry-Run Executor - unit tests and live simulation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build-check
  deployed-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real Pharos dry runs
        run: node scripts/smoke-deployed.mjs
      - name: Upload real read-only on-chain evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pharos-atlantic-dry-run-evidence
          path: proof/live-dry-run.json
          retention-days: 30
          if-no-files-found: error
